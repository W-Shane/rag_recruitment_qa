services:
  rag-recruit:
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ./chroma_db:/app/chroma_db   # 挂载向量库，持久化
      - ./models:/app/models         # 挂载本地模型目录到容器
      - ./data:/app/data            #data 目录挂载
      - ./eval:/app/eval            # 挂载 eval 目录
    env_file:
      - .env   # 新增，告诉compose：把.env全部环境变量注入容器内程序
    environment:
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
    stdin_open: true
    tty: true
    command: >
      bash -c "python scripts/build_vector_db.py && python eval/run_eval.py"
    #容器执行（与本地执行一样），替换掉上面两行
    #command: ["sleep", "infinity"]
